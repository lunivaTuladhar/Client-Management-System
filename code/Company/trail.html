<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .error-message { color: #d93025; display: none; margin-top: 5px; font-size: 0.9em; }
        label { cursor: pointer; }
        button { padding: 10px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <form id="interestForm">
        <h3>What are your interests? (Select at least one)</h3>
        
        <div class="form-group">
            <label><input type="checkbox" name="interest" value="coding"> Coding</label><br>
            <label><input type="checkbox" name="interest" value="music"> Music</label><br>
            <label><input type="checkbox" name="interest" value="travel"> Travel</label><br>
            <label><input type="checkbox" name="interest" value="fitness"> Fitness</label>
        </div>

        <p id="error" class="error-message">Please select at least one option before submitting.</p>
        
        <button type="submit">Submit Selection</button>
    </form>

    <script>
        const form = document.getElementById('interestForm');
        const checkboxes = document.querySelectorAll('input[name="interest"]');
        const errorMessage = document.getElementById('error');

        form.addEventListener('submit', (event) => {
            // Check if at least one checkbox is checked
            const isOneChecked = Array.from(checkboxes).some(checkbox => checkbox.checked);

            if (!isOneChecked) {
                // Prevent the form from submitting
                event.preventDefault();
                // Show the error message
                errorMessage.style.display = 'block';
            } else {
                // Hide error message if they fixed it
                errorMessage.style.display = 'none';
                alert('Form submitted successfully!');
            }
        });
    </script>

</body>
</html>
